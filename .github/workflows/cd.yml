name: CD - Build & Publish Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'frontend-asistencia/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pom.xml'
      - 'frontend-asistencia/package*.json'
  workflow_dispatch:

jobs:
  check-secrets:
    name: Comprobar secrets GHCR
    runs-on: ubuntu-latest
    outputs:
      has_ghcr: ${{ steps.check.outputs.has_ghcr }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.GHCR_PAT }}" ] && [ -n "${{ secrets.GHCR_USERNAME }}" ]; then
            echo "has_ghcr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ghcr=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build y publicar imagenes
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        if: needs.check-secrets.outputs.has_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Construir y publicar imagen backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ needs.check-secrets.outputs.has_ghcr == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/control-asistencia-backend:latest
            ghcr.io/${{ github.repository_owner }}/control-asistencia-backend:${{ github.sha }}

      - name: Construir y publicar imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend-asistencia
          file: frontend-asistencia/Dockerfile
          push: ${{ needs.check-secrets.outputs.has_ghcr == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/control-asistencia-frontend:latest
            ghcr.io/${{ github.repository_owner }}/control-asistencia-frontend:${{ github.sha }}