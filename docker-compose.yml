services:
  db:
    image: postgres:16-alpine
    container_name: control-asistencia-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_asistencia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-control_asistencia}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: control-asistencia-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-control_asistencia}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - APP_QR_BASE_URL=${APP_QR_BASE_URL:-http://localhost:8080}
      - JWT_SECRET=${JWT_SECRET:-clave-secreta-super-segura-para-desarrollo-cambiar-en-produccion-1234567890}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - qr_data:/app/static/qr

  frontend:
    build: ./frontend-asistencia
    container_name: control-asistencia-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    # Opcional: monta tus certificados reales sobre los autofirmados por defecto
    # volumes:
    #   - ./certs/server.crt:/etc/nginx/ssl/server.crt
    #   - ./certs/server.key:/etc/nginx/ssl/server.key

volumes:
  postgres_data:
  qr_data: