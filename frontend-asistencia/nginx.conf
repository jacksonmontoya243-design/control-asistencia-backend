# Redirección de HTTP a HTTPS
server {
    listen 80;

    server_name _;

    # Si no hay certificado configurado (SSL_CERT/SSL_KEY vacíos), se mantiene HTTP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name _;

    # Certificados TLS. Deben montarse en el contenedor (ver docker-compose.yml).
    # Si las variables SSL_CERT/SSL_KEY no apuntan a archivos válidos, nginx
    # usará el certificado de arranque por defecto (generado al construir la imagen).
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el Backend (API)
    location /api {
        proxy_pass http://backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy para las imágenes QR
    location /qr {
        proxy_pass http://backend:8080/qr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
