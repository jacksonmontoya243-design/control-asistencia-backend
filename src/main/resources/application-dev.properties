# =============================================================================
# PERFIL: dev (desarrollo local)
# PostgreSQL local por defecto. Niveles de log detallados y SQL visible.
# =============================================================================

# Conexión a PostgreSQL local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/control_asistencia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate (dev: recrea/actualiza esquema y muestra SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Niveles de log en desarrollo
logging.level.com.example.controlasistenciabackend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Rate limiting desactivado en desarrollo
app.ratelimit.enabled=false

# No forzar HTTPS en desarrollo local
app.security.requires-secure=false