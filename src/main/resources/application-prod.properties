# =============================================================================
# PERFIL: prod (producción)
# Configuración pensada para desplegar en contenedores Docker.
# No se definen valores secretos por defecto: es obligatorio inyectarlos
# mediante variables de entorno (JWT_SECRET, SPRING_DATASOURCE_PASSWORD, etc.).
# =============================================================================

# Conexión a PostgreSQL (en Docker el host es el nombre del servicio "db")
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/${POSTGRES_DB:control_asistencia}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate (prod: no mostrar SQL, formato legible)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Secret JWT obligatorio en producción (sin valor por defecto)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Niveles de log en producción (solo INFO)
logging.level.com.example.controlasistenciabackend=INFO

# Rate limiting (activo en producción)
app.ratelimit.enabled=true
app.ratelimit.max-requests=100
app.ratelimit.window-seconds=60

# Forzar tráfico HTTPS (redirección de HTTP a HTTPS en el backend)
app.security.requires-secure=true

# Confiar en los headers X-Forwarded-* que envía nginx (para requiresSecure)
server.forward-headers-strategy=framework