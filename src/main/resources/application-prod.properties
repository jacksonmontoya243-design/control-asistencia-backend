# PostgreSQL

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/control_asistencia}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# JWT

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION:86400000}


# Logs

logging.level.com.example.controlasistenciabackend=INFO


# Rate limiting

app.ratelimit.enabled=true

app.ratelimit.max-requests=100

app.ratelimit.window-seconds=60


# HTTPS

app.security.requires-secure=false

server.forward-headers-strategy=framework