spring.application.name=control-asistencia-backend

# Perfil activo por defecto (dev o prod). Se puede sobreescribir con SPRING_PROFILE
spring.profiles.active=${SPRING_PROFILE:dev}

# Configuración JWT (secret y expiración)
app.jwt.secret=${JWT_SECRET:clave-secreta-super-segura-para-desarrollo-cambiar-en-produccion-1234567890}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# URL Base para la generacion de codigos QR
app.qr.base-url=${APP_QR_BASE_URL:http://localhost:8080}

# Credenciales del usuario administrador por defecto (creado por DataInitializer)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}